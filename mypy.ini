[mypy]
python_version = 3.10
files = src/
ignore_missing_imports = False

# Third-party libraries without type stubs / py.typed marker.
# These are unavoidable per the Phase 10 roadmap note — every ignore here
# is for a real dependency we don't control.

[mypy-smolagents.*]
ignore_missing_imports = True

[mypy-frontmatter]
ignore_missing_imports = True

[mypy-plotly.*]
ignore_missing_imports = True

[mypy-streamlit_folium]
ignore_missing_imports = True

[mypy-requests]
ignore_missing_imports = True
